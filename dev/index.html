<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>&lt;my-element> Demo</title>
    <script src="../node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
    <script src="../node_modules/lit/polyfill-support.js"></script>
    <script type="module" src="../dist/x-element.js"></script>
    <script type="module" src="../dist/x-button.js"></script>
    <script type="module" src="../dist/x-counter.js"></script>
    <style>
      p {
        border: solid 1px blue;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <x-element>
      <p>This is child content</p>
    </x-element>
    <x-button onclick="xonclick()">Hello</x-button>
    <x-counter></x-counter>
  </body>
  <script>
    const element = document.querySelector("my-element");
    element.addEventListener('count-changed', () => {
      console.log('Count Changed')
    });

    function xonclick() {
      console.log("Clicked")
    };
  </script>
</html>
